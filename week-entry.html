{{template "base.html" .}}

{{define "content"}}
<div class="max-w-md mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-2xl font-bold mb-4">Week {{.WeekNumber}} Entry</h1>
    <p class="mb-4">Enter the actual points you allocated this past week.</p>
    <form method="post" action="/week-entry">
        {{range $cat := .Categories}}
        <div class="flex justify-between items-center mb-2">
            <label>{{$cat.Name}}</label>
            <input type="number" name="{{$cat.Key}}" min="0" value="0" class="border rounded px-2 py-1 w-20">
        </div>
        {{end}}
        <button type="submit" class="mt-6 w-full bg-blue-600 text-white py-2 rounded">Save Week Data</button>
    </form>
</div>
{{end}}
